add('Past Continuous','Was/were + V-ing; gunakan simple past untuk kejadian singkat yang menyela.',[['Saya sedang tidur ketika kamu menelepon.','I was sleeping when you called'],['Mereka sedang belajar pukul delapan tadi malam.','They were studying at eight last night'],['Dia (perempuan) tidak sedang memasak ketika saya tiba.','She was not cooking when I arrived'],['Apakah kamu sedang membaca ketika dia (laki-laki) datang?','Were you reading when he came'],['Ibu saya sedang membersihkan dapur ketika saya pulang.','My mother was cleaning the kitchen when I got home|My mother was cleaning the kitchen when I came home'],['Kami sedang menonton TV ketika telepon berdering.','We were watching TV when the phone rang']]);
add('Present Perfect','Have/has + V3; have/has been untuk nominal; yet, already, ever.',[['Saya sudah mencuci mobil.','I have washed the car|I have already washed the car'],['Dia (perempuan) belum menyelesaikan pekerjaan rumahnya.','She has not finished her homework yet|She has not finished her homework'],['Apakah kamu pernah mengunjungi museum itu?','Have you ever visited the museum'],['Kami sudah berada di sini selama dua jam.','We have been here for two hours'],['Dia (laki-laki) baru saja pulang.','He has just come home|He has just got home|He has just gotten home'],['Apakah mereka sudah makan sarapan?','Have they had breakfast|Have they had breakfast yet']]);

add('Noun Phrase','DASN: determiner + ordinal + cardinal + adjective + noun; noun modifier sebelum head noun.',[['Tiga teman saya yang sangat ramah sedang belajar.','My three very friendly friends are studying'],['Dua siswa pertama saya membeli buku baru.','My first two students bought new books'],['Dia (perempuan) memiliki beberapa buku bahasa Inggris yang menarik.','She has several interesting English books'],['Apakah dua guru bahasa Inggris baru itu ramah?','Are the two new English teachers friendly'],['Saya membeli tiga kaus biru baru kemarin.','I bought three new blue T-shirts yesterday'],['Kedua teman saya yang ramah dan sabar itu sedang memasak.','My two friendly and patient friends are cooking|My two patient and friendly friends are cooking|My two friendly patient friends are cooking|My two patient friendly friends are cooking']]);

let data={history:[],miss:[]};try{data=JSON.parse(localStorage.getItem('jagoStudyV8'))||data}catch{};function save(){try{localStorage.setItem('jagoStudyV8',JSON.stringify(data))}catch{}}let page='Dashboard',q=null,mode='Mixed',queue=[],checked=false,sp=null,rec=null,stream=null,recognition=null,timer=null,elapsed=0,started=0,run=0,recording=false;const tabs=['Dashboard','Writing Practice','Speaking Practice','Daily Challenge','My Progress','Study Review'];function go(p){if(recording)stopRecording();run++;clearInterval(timer);if(recognition)try{recognition.abort()}catch{};page=p;render()}function nav(){ $('nav').innerHTML=tabs.map(t=>`<button class="${page===t?'active':''}" onclick="go('${t}')">${t==='Read Aloud'?'Reading Out Loud':t}</button>`).join('')};function render(){nav();let m=$('main');if(page==='Dashboard'){let w=data.history.filter(x=>x.kind==='Writing');m.innerHTML=`<div class="hero"><small>YOUR ENGLISH PRACTICE SPACE</small><h1>Build your English, one day at a time.</h1><p>Latihan singkat, skor akhir, pembahasan, dan kesempatan mencoba kembali.</p><div class="actions"><button onclick="go('Writing Practice')">10-Day Writing</button><button onclick="go('Speaking Practice')">10-Day Speaking</button><button onclick="go('Read Aloud')">10-Day Reading Out Loud</button></div></div><div class="grid"><div class="card"><small>Writing attempts</small><div class="stat">${w.length}</div></div><div class="card"><small>Jawaban cocok</small><div class="stat">${w.length?Math.round(w.filter(x=>x.ok).length/w.length*100):0}%</div></div><div class="card"><small>Speaking sessions</small><div class="stat">${data.history.filter(x=>x.kind==='Speaking').length}</div></div></div><div class="grid"><div class="card"><h2>Writing</h2><p>10 pertemuan · 450 soal campuran dengan kosakata beragam dan pembahasan pola.</p><button class="primary" onclick="go('Writing Practice')">Start writing</button></div><div class="card"><h2>Speaking</h2><p>10 pertemuan · topik adaptasi IELTS, rekaman dan evaluasi latihan.</p><button class="primary" onclick="go('Speaking Practice')">Start speaking</button></div><div class="card"><h2>Reading Out Loud</h2><p>10 pertemuan · American English model audio, linking sounds, recording and transcript review.</p><button class="primary" onclick="go('Read Aloud')">Start reading</button></div></div><div class="card"><h3>Referensi & batasan</h3><p>Writing: cakupan Essential Grammar in Use, materi Modal dan DASN Jago Inggris. Vocabulary: pilihan kosakata English for Everyone. Speaking: topik dari bank IELTS Mei–Agustus 2024, dengan pertanyaan baru yang disederhanakan. Present perfect continuous dan beberapa latihan tambahan mengikuti silabus tutor. Comparison diasumsikan sebagai maksud “compression”.</p><p>Penilaian writing berbasis kunci, bukan AI; speaking berbasis transkrip dan indikator latihan, bukan skor IELTS atau penilaian pronunciation. Riwayat tersimpan pada browser ini saja.</p></div>`}else if(page==='Writing Practice'||page==='Daily Challenge'||page==='Study Review'){mode=page==='Study Review'?'Review':page==='Daily Challenge'?'Daily':'Mixed';queue=[];session=[];total=0;m.innerHTML=`<h1>${page}</h1><div class="card">${page==='Writing Practice'?`<label>Materi</label><select id="topic" onchange="mode=this.value;queue=[];session=[];total=0;nextQ()"><option>Mixed</option>${[...new Set(bank.map(x=>x.t))].map(t=>`<option>${t}</option>`).join('')}</select>`:''}<div id="exercise"></div></div>`;nextQ()}else if(page==='Speaking Practice'){m.innerHTML=`<h1>Speaking Practice</h1><div class="card"><label>Practice part</label><select id="part" onchange="newSpeak()"><option value="1">Part 1 · Short answers (30 sec)</option><option value="2">Part 2 · Talk (60 sec)</option><option value="3">Part 3 · Opinion (45 sec)</option></select><div id="speaking"></div></div>`;newSpeak()}else{m.innerHTML=`<h1>My Progress</h1><div class="card"><p>Riwayat lokal pada perangkat ini. Ekspor untuk dibagikan kepada tutor secara sukarela.</p><div class="actions"><button onclick="exportData()">Export CSV</button><button onclick="if(confirm('Hapus riwayat pada perangkat ini?')){data={history:[],miss:[]};save();render()}">Reset</button></div><div style="overflow:auto"><table><tr><th>Tanggal</th><th>Skill</th><th>Materi</th><th>Hasil</th></tr>${data.history.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.topic)}</td><td>${esc(x.result)}</td></tr>`).join('')}</table></div></div>`}}
let session=[],total=0;
function nextQ(){let pool=mode==='Review'?bank.filter(x=>data.miss.includes(x.id)):mode==='Mixed'||mode==='Daily'?bank:bank.filter(x=>x.t===mode);if(!pool.length){$('exercise').innerHTML='<p>Belum ada soal yang perlu diulang.</p>';return}if(!queue.length){queue=pool.slice().sort(()=>Math.random()-.5);queue=queue.slice(0,mode==='Daily'?5:10);total=queue.length;session=[]}q=queue.shift();checked=false;$('exercise').innerHTML=`<p><span class="tag">${esc(q.t)}</span> <small>${queue.length} soal tersisa dalam putaran</small></p><h2>Translate into English</h2><p>${esc(q.q)}</p><textarea id="answer" placeholder="Type your answer here..."></textarea><div class="actions"><button class="primary" id="check" onclick="checkQ(false)">Submit / Next</button><button onclick="checkQ(true)">Skip</button></div><div id="result" aria-live="polite"></div>`}
function norm(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/\b(won't)\b/g,'will not').replace(/\b(can't)\b/g,'cannot').replace(/\b(\w+)n't\b/g,'$1 not').replace(/\b(i)'m\b/g,'$1 am').replace(/\b(you|we|they)'re\b/g,'$1 are').replace(/\b(i|you|we|they)'ve\b/g,'$1 have').replace(/\b(i|you|he|she|we|they)'ll\b/g,'$1 will').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function checkQ(skip=false){if(checked)return;let a=skip?'':$('answer').value.trim();if(!a&&!skip){$('result').textContent='Isi jawaban atau pilih Skip.';return}checked=true;let ok=!skip&&q.a.some(x=>norm(x)===norm(a));session.push({q,a,ok});data.history.push({date:new Date().toLocaleDateString('id-ID'),kind:'Writing',topic:q.t,ok,result:ok?'Cocok':'Perlu review'});data.miss=data.miss.filter(i=>i!==q.id);if(!ok)data.miss.push(q.id);save();if(queue.length)nextQ();else finishWriting()}
function finishWriting(){let correct=session.filter(x=>x.ok).length;let score=Math.round(100*correct/session.length);$('exercise').innerHTML=`<div class="card"><small>WRITING RESULT</small><div class="stat" style="font-size:56px">${score}/100</div><p>${correct} dari ${session.length} jawaban cocok dengan kunci.</p><progress max="100" value="${score}"></progress></div><h2>Feedback & Review</h2><p>Jawaban alternatif yang benar mungkin belum terdaftar dalam kunci.</p>${session.map((x,i)=>`<div class="feedback ${x.ok?'good':'bad'}"><strong>${i+1}. ${x.ok?'Cocok':'Perlu review'} · ${esc(x.q.t)}</strong><p>${esc(x.q.q)}</p><p>Jawaban kamu: ${esc(x.a||'Dilewati')}</p><p>Contoh jawaban: ${esc(x.q.example||x.q.a[0])}</p><p>${esc(x.q.rule)}</p></div>`).join('')}<div class="actions"><button class="primary" onclick="session=[];queue=[];nextQ()">Latihan baru</button><button onclick="go('Study Review')">Review mistakes</button></div>`}
function say(s){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}}function showVocab(){let s=$('search').value.toLowerCase();$('words').innerHTML='<table><tr><th>English</th><th>Indonesia</th><th>Audio</th></tr>'+vocab.filter(v=>v.join(' ').toLowerCase().includes(s)).map(v=>`<tr><td>${esc(v[1])}<br><small>${esc(v[0])}</small></td><td>${esc(v[2])}</td><td><button onclick="say('${v[1]}')">Listen</button></td></tr>`).join('')+'</table>'}
function speakingTarget(){return activeDay>=0?Math.min(250,150+activeDay*50):({1:25,2:60,3:40}[sp[1]])}
function speakingLimit(){return activeDay>=0?Math.ceil(speakingTarget()/50)*60:({1:30,2:60,3:45}[sp[1]])}

const readingTexts=[["My Daily Routine", "Every morning, I wake up at six and get out of bed. I open the window and look outside. After that, I take a shower and put on my clothes. I eat an egg and a piece of bread before I go to class. On the way, I often meet a friend. We talk about our plans and walk into the classroom together. At the end of the day, I go home and help my family. I enjoy a quiet evening because it gives me time to relax. Before I go to bed, I read a book and think about what I learned."], ["My Favorite Place", "There is a small park near my home. I often go there after class. I sit on a bench and look at the trees. Sometimes I take a book or a bottle of water with me. When a friend comes along, we walk around and talk about our day. I like the park because it is quiet and easy to get to. On a sunny day, I can sit outside for an hour. At the end of our visit, we pick up our things and go home."], ["My Childhood", "When I was a child, I lived in a small town. I used to play outside with my cousins. We ran around the garden and made up our own games. One afternoon, we found an old box under a tree. We opened it and looked inside. There were a few pictures and a little toy. We took it home and showed it to our parents. They told us a story about the box. I still think about that day because it was full of fun."], ["A Wonderful Holiday", "Last year, my family went on a short trip. We got up early and packed our bags. On the way to the beach, we stopped at a small shop to buy some food. When we arrived, we took off our shoes and walked along the water. I picked up a shell and gave it to my sister. After lunch, we sat under a tree and talked about our plans. It was a simple holiday, but I enjoyed every part of it."], ["My Best Friend", "My best friend is easy to talk to. We met at school and found out that we liked the same games. When I have a problem, I can ask for advice. My friend listens to me and tries to help. We often work on our homework together. If one of us makes a mistake, we talk about it and try again. On weekends, we go out for a walk or eat at a small cafe. I am glad to have a friend who cares about others."], ["Learning English", "I have been learning English for a few months. At first, I was afraid to speak in front of other people. Now I try to use English every day. I listen to short stories and repeat the words out loud. When I come across a new word, I write it down and look it up. I also talk to a friend in English after class. We help each other and learn from our mistakes. I know that learning takes time, so I keep on practicing."], ["Technology in Our Lives", "I use my phone to look up information and keep in touch with friends. It helps me find out about new things. I can also listen to an English lesson on the way home. However, I try not to spend all of my time on a screen. When I sit down to eat, I put my phone away and talk to my family. At night, I turn it off before I go to bed. Technology is useful when we use it in a careful way."], ["Healthy Habits", "I try to take care of myself every day. I drink water when I wake up and eat a good breakfast. After school, I go for a walk or play a game with my friends. When I feel tired, I take a break and give myself time to rest. I also try to get enough sleep at night. If I have a lot of homework, I make a plan and work on one thing at a time. Small habits can make a big difference."], ["My Future Plans", "In the future, I would like to learn more about the world. I want to improve my English and meet people from other places. To reach my goal, I plan to study a little every day. I will look for useful books and listen to simple English talks. I also hope to take part in a school project. If I make a mistake, I will learn from it and try again. I know that a good plan is only the first step."], ["A Meaningful Experience", "One day, I helped out at a school event. At first, I did not know what to do. A teacher asked me to set up a table and hand out some papers. I worked with a group of friends, and we helped each other. When a visitor came in, I showed her where to go. At the end of the event, we cleaned up the room and put everything away. I felt proud because I had done something useful. I learned that even a small act of kindness can help someone."]];
tabs.splice(3,0,'Read Aloud');
const v8render=render;render=function(){if(page!=='Read Aloud'){v8render();return}nav();$('main').innerHTML='<h1>Reading Out Loud · 10 Days</h1><p>American English · connected speech · basic level</p><div class="grid">'+readingTexts.map((x,i)=>`<div class="card"><small>DAY ${i+1}</small><h2>${esc(x[0])}</h2><button class="primary" onclick="openReading(${i})">Start reading</button></div>`).join('')+'</div>'};
let readingDay=0;function openReading(i){readingDay=i;activeDay=i;let [title,text]=readingTexts[i];$('main').innerHTML=`<button onclick="go('Read Aloud')">← All days</button><div class="card"><h1>${esc(title)}</h1><p>Listen to the model, then read the text aloud. Connect words naturally: wake‿up, get‿out, look‿at.</p><div class="card" style="background:#eff6ff;color:#16365c"><h3>American English model audio</h3><label for="modelVoice">Voice (available on this device)</label><select id="modelVoice"></select><label for="modelRate">Speed</label><select id="modelRate"><option value="1">Natural</option><option value="0.8">Slow practice</option></select><div class="actions"><button class="primary" onclick="playReadingModel()">▶ Play example</button><button onclick="stopReadingModel()">■ Stop audio</button></div><p id="modelStatus" aria-live="polite"></p><small>Prefer natural / online American voices when available. Audio is synthesized, not a verified native recording.</small></div><label><input type="checkbox" checked onchange="document.getElementById('readingPassage').innerHTML=markedReading(readingTexts[readingDay][1],this.checked)"> Show linking sounds (‿)</label><p id="readingPassage" style="font-size:20px;line-height:1.9">${markedReading(text,true)}</p><p><small>Blue links show selected consonant-to-vowel or vowel-to-vowel connections. Keep words in one thought group; pause at punctuation.</small></p><p>Transcription is optional and may use your browser's speech service. Do not include personal information.</p><div id="clock">00:00</div><button id="start" onclick="startRecording()">Start microphone</button><button id="stop" disabled onclick="stopRecording()">Stop</button><p id="status"></p><audio id="audio" controls hidden></audio><textarea id="transcript" oninput="updateWordCount()" placeholder="Recognized words"></textarea><p id="wordCount"></p><progress id="wordProgress" max="100"></progress><button class="primary" onclick="readingFeedback()">Finish & review</button><div id="sfeedback"></div></div>`;loadModelVoices()}
const oldTarget=speakingTarget; speakingTarget=function(){return page==='Read Aloud'?readingTexts[readingDay][1].split(/\s+/).length:oldTarget()};
function tokens(s){return s.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[]}
function readingFeedback(){if(recording)stopRecording();let ref=tokens(readingTexts[readingDay][1]),got=tokens($('transcript').value);if(!got.length){$('sfeedback').textContent='No transcript available.';return}let n=ref.length,m=got.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=ref[i]===got[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);let matched=new Set(),i=0,j=0;while(i<n&&j<m){if(ref[i]===got[j]){matched.add(i++);j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}let score=Math.round(100*matched.size/n);$('sfeedback').innerHTML=`<h2>Transcript coverage: ${score}%</h2><p>${ref.map((w,k)=>`<span style="color:${matched.has(k)?'#16803b':'#b45309'}">${esc(w)}</span>`).join(' ')}</p><p>Green = matched; orange = not matched in transcript (may be recognition error). This is not pronunciation accuracy. Listen again for linking, stress and intonation.</p><p>Acoustic pronunciation score: unavailable without speech assessment service.</p>`;data.history.push({date:new Date().toLocaleDateString('id-ID'),kind:'Read Aloud',topic:'Day '+(readingDay+1),result:score+'% transcript coverage'});save()}
const baseFeedback=speakFeedback;speakFeedback=function(){let text=$('transcript').value.trim();if(!text){baseFeedback();return}baseFeedback();let words=tokens(text),stop=new Set('i you he she it we they a an the to of in on at is am are was were be been and or but for my your our their his her that this with as have has had do does did can will would should not me him them'.split(' ')),counts={};words.filter(w=>!stop.has(w)).forEach(w=>counts[w]=(counts[w]||0)+1);let repeated=Object.entries(counts).filter(([w,n])=>n>Math.max(3,words.length*.045)).sort((a,b)=>b[1]-a[1]);let penalty=Math.min(15,repeated.reduce((s,[w,n])=>s+n-3,0));let h=data.history[data.history.length-1],score=Math.max(0,Number(h.result.split('/')[0])-penalty);h.result=score+'/100; repetition penalty '+penalty;save();let sentences=text.split(/[.!?]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);let duplicate=sentences.length-new Set(sentences).size;$('sfeedback').insertAdjacentHTML('afterbegin',`<div class="card"><h2>Adjusted practice score: ${score}/100</h2><p>Repetition penalty: −${penalty}. ${esc(repeated.map(([w,n])=>w+' × '+n).join(', ')||'No excessive content-word repetition detected.')}</p></div>`);$('sfeedback').insertAdjacentHTML('beforeend',`<div class="card"><h2>Idea & delivery coaching</h2><p>Repeated exact sentences: ${duplicate}. Reason marker: ${/\bbecause\b/i.test(text)?'detected':'try explaining why'}. Example marker: ${/\b(for example|for instance)\b/i.test(text)?'detected':'add a specific example'}.</p><p>Use Point → Reason → Example → Conclusion. Pause between ideas, stress key words, and connect final consonants to following vowels. Check whether each idea answers the question.</p><p>Semantic relevance and acoustic pronunciation are not automatically scored in this offline version.</p></div>`)};


let modelUtterance=null;
function loadModelVoices(){let el=$('modelVoice');if(!el)return;let previous=el.value;let voices=window.speechSynthesis?.getVoices()||[];voices=voices.filter(v=>/^en[-_]US$/i.test(v.lang)).sort((a,b)=>Number(/natural|neural|online|premium|enhanced/i.test(b.name))-Number(/natural|neural|online|premium|enhanced/i.test(a.name)));el.replaceChildren();for(let v of voices){let o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name;el.append(o)}if(!voices.length){let o=document.createElement('option');o.value='';o.textContent='Default American English (if supported)';el.append(o)}if(voices.some(v=>v.voiceURI===previous))el.value=previous;}
if(window.speechSynthesis)window.speechSynthesis.addEventListener('voiceschanged',loadModelVoices);
function stopReadingModel(){window.speechSynthesis?.cancel();modelUtterance=null;if($('modelStatus'))$('modelStatus').textContent='Audio stopped.';}
function playReadingModel(){if(recording){$('modelStatus').textContent='Stop your recording before playing the example.';return}if(!window.speechSynthesis){$('modelStatus').textContent='Audio synthesis is not supported on this browser.';return}stopReadingModel();let u=new SpeechSynthesisUtterance(readingTexts[readingDay][1]);u.lang='en-US';u.rate=Number($('modelRate').value);let v=speechSynthesis.getVoices().find(v=>v.voiceURI===$('modelVoice').value);if(v)u.voice=v;modelUtterance=u;u.onstart=()=>{if(modelUtterance===u&&$('modelStatus'))$('modelStatus').textContent='Playing model audio…'};u.onend=()=>{if(modelUtterance===u&&$('modelStatus'))$('modelStatus').textContent='Finished. Now try reading aloud.'};u.onerror=()=>{if(modelUtterance===u&&$('modelStatus'))$('modelStatus').textContent='Audio unavailable. Try another American voice or browser.'};speechSynthesis.speak(u)}
const linkPairs=new Set(('wake up|up at|get out|out of|look outside|take a|put on|eat an|an egg|piece of|talk about|walk into|at the end|end of|read a|think about|sit on|look at|book or|bottle of|comes along|walk around|sit outside|for an|pick up|ran around|made up|found an|box under|opened it|looked inside|took it|showed it|went on|got up|up early|took off|walked along|picked up|gave it|sat under|found out|work on|one of|about it|try again|go out|eat at|speak in|front of|words out|come across|write it|look it|it up|each other|keep on|look up|keep in|find out|out about|listen to an|all of|phone away|turn it|it off|care of|eat a|take a|get enough|lot of|work on|thing at|more about|want to improve|take part|part in|make a|helped out|out at|set up|hand out|came in|cleaned up|put everything|everything away|act of').split('|').filter(x=>x.split(' ').length===2));
function markedReading(t,show){if(!show)return esc(t);return esc(t).replace(/([A-Za-z]+)( +)(?=([A-Za-z]+))/g,(all,a,space,b)=>linkPairs.has((a+' '+b).toLowerCase())?a+'<span style="color:#1d4ed8;font-weight:bold" title="Connect these sounds">‿</span>':all)}
const beforeModelGo=go;go=function(p){stopReadingModel();beforeModelGo(p)};const beforeModelRecord=startRecording;startRecording=function(){stopReadingModel();return beforeModelRecord()};
